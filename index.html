<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabyBuddy Offline Quick-Log</title>
  <!-- Inline PWA Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"BabyBuddy Offline","short_name":"BabyBuddy","start_url":".","display":"standalone","background_color":"#f3f4f6","theme_color":"#2563eb"}'>
  <!-- Tailwind CSS & Dexie.js via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>👶</span> BabyBuddy
      </h1>
      <div class="flex items-center gap-2">
        <span id="net-badge" class="text-xs px-2 py-1 rounded font-semibold bg-gray-200 text-gray-800">Checking...</span>
        <button onclick="toggleSettings()" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded border border-blue-500">⚙️ Config</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Outbox Status Banner -->
    <div id="outbox-banner" class="hidden bg-amber-50 border border-amber-200 rounded-lg p-4 flex justify-between items-center shadow-sm">
      <div>
        <span class="font-semibold text-amber-800">Pending Sync: </span>
        <span id="outbox-count" class="font-bold text-amber-900">0</span> items queued
      </div>
      <button onclick="triggerSync()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded font-medium">Sync Now</button>
    </div>

    <!-- Local Outbox History Card -->
    <div id="queue-history-card" class="bg-white p-5 rounded-lg shadow space-y-3 hidden">
    <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
        <span>📦</span> Queued Offline Logs
        </h2>
        <span id="queue-badge-count" class="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">0 pending</span>
    </div>

    <!-- Queue Items Container -->
    <div id="queue-list" class="space-y-3 max-h-60 overflow-y-auto divide-y divide-gray-100">
        <!-- Items rendered dynamically via JS -->
    </div>
    </div>

    <!-- API Settings Panel -->
    <div id="settings-panel" class="hidden bg-white p-5 rounded-lg shadow border space-y-4">
      <h2 class="text-lg font-bold border-b pb-2 text-gray-700">API Configuration</h2>
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Server URL</label>
        <input type="url" id="cfg-server" placeholder="https://babybuddy.yourdomain.com" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">API Token</label>
        <input type="password" id="cfg-token" placeholder="Authorization Token" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      <!-- NEW HTML WITH CHILD SELECT DROPDOWN -->
        <div>
        <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold uppercase text-gray-600">Child</label>
            <button type="button" onclick="fetchChildren()" class="text-xs text-blue-600 hover:text-blue-800 font-medium">🔄 Fetch Children</button>
        </div>
        <select id="cfg-child" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 text-sm bg-white border-gray-200">
            <option value="">Fetch children first...</option>
        </select>
        </div>
      <button onclick="saveSettings()" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 text-sm">Save Configuration</button>
    </div>

    <!-- Diaper Change Form -->
    <div class="bg-white p-5 rounded-lg shadow space-y-4">
      <h2 class="text-lg font-bold text-gray-800 border-b pb-2 flex items-center gap-2">
        <span>🧷</span> Diaper Change
      </h2>
      <div class="grid grid-cols-3 gap-2">
        <label class="flex items-center justify-center border rounded p-3 cursor-pointer bg-gray-50 hover:bg-blue-50 text-sm font-medium border-gray-200">
          <input type="checkbox" id="diaper-wet" class="mr-2 h-4 w-4 text-blue-600"> Wet
        </label>
        <label class="flex items-center justify-center border rounded p-3 cursor-pointer bg-gray-50 hover:bg-blue-50 text-sm font-medium border-gray-200">
          <input type="checkbox" id="diaper-solid" class="mr-2 h-4 w-4 text-blue-600"> Solid
        </label>
        <select id="diaper-color" class="border rounded p-2 text-sm bg-white border-gray-200">
          <option value="">Color...</option>
          <option value="yellow">Yellow</option>
          <option value="brown">Brown</option>
          <option value="green">Green</option>
          <option value="black">Black</option>
        </select>
      </div>
      <input type="text" id="diaper-notes" placeholder="Notes (optional)" class="w-full p-2 border rounded text-sm border-gray-200">
      <button onclick="logDiaper()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded shadow-sm text-sm">Log Diaper</button>
    </div>

    <!-- Feeding Form -->
    <div class="bg-white p-5 rounded-lg shadow space-y-4">
      <h2 class="text-lg font-bold text-gray-800 border-b pb-2 flex items-center gap-2">
        <span>🍼</span> Feeding
      </h2>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Type</label>
          <select id="feed-type" class="w-full border rounded p-2 text-sm bg-white border-gray-200">
            <option value="formula">Formula</option>
            <option value="breast milk">Breast Milk</option>
            <option value="fortified breast milk">Fortified Milk</option>
            <option value="solid food">Solid Food</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Method</label>
          <select id="feed-method" class="w-full border rounded p-2 text-sm bg-white border-gray-200">
            <option value="bottle">Bottle</option>
            <option value="left breast">Left Breast</option>
            <option value="right breast">Right Breast</option>
            <option value="both breasts">Both Breasts</option>
            <option value="self fed">Self Fed</option>
            <option value="parent fed">Parent Fed</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Amount (ml/oz)</label>
          <input type="number" id="feed-amount" step="0.1" placeholder="Optional" class="w-full p-2 border rounded text-sm border-gray-200">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Duration (minutes)</label>
          <input type="number" id="feed-duration" value="15" class="w-full p-2 border rounded text-sm border-gray-200">
        </div>
      </div>
      <input type="text" id="feed-notes" placeholder="Notes (optional)" class="w-full p-2 border rounded text-sm border-gray-200">
      <button onclick="logFeeding()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded shadow-sm text-sm">Log Feeding</button>
    </div>

    <!-- Sleep Tracker Form -->
    <div class="bg-white p-5 rounded-lg shadow space-y-4">
    <h2 class="text-lg font-bold text-gray-800 border-b pb-2 flex items-center gap-2">
        <span>🌙</span> Sleep Tracker
    </h2>

    <!-- Idle State: Start Button -->
    <div id="sleep-idle-state" class="space-y-3">
        <input type="text" id="sleep-notes" placeholder="Notes (optional)" class="w-full p-2 border rounded text-sm border-gray-200">
        <button onclick="startSleepTimer()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded shadow-sm text-sm flex justify-center items-center gap-2">
        <span>▶️</span> Start Sleep Timer
        </button>
    </div>

    <!-- Active State: Running Stopwatch -->
    <div id="sleep-active-state" class="hidden space-y-3 bg-indigo-50 p-4 rounded-lg border border-indigo-100 text-center">
        <div class="text-xs uppercase font-semibold text-indigo-500">Sleep Timer Running</div>
        <div id="sleep-timer-display" class="text-3xl font-mono font-bold text-indigo-900">00:00:00</div>
        <div class="text-xs text-indigo-600" id="sleep-start-time">Started at --:--</div>
        <button onclick="stopSleepTimer()" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded shadow-sm text-sm flex justify-center items-center gap-2">
        <span>⏹️</span> Stop &amp; Log Sleep
        </button>
    </div>
    </div>

    <!-- Recent Server History Card -->
    <div id="server-history-card" class="bg-white p-5 rounded-lg shadow space-y-3 hidden">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <span>📜</span> Recent Server History
        </h2>
        <button onclick="fetchRecentHistory()" class="text-xs text-blue-600 hover:text-blue-800 font-medium">🔄 Refresh</button>
      </div>

      <div id="server-history-list" class="space-y-3 max-h-80 overflow-y-auto divide-y divide-gray-100">
        <!-- Server logs rendered dynamically via JS -->
      </div>
    </div>

    <!-- Floating Toast Notification -->
    <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-xs shadow-lg transition-opacity duration-300"></div>

  </main>

  <script>
  // --- Dexie Database Initialization ---
  const db = new Dexie('BabyBuddyPWA');
  db.version(1).stores({
    config: 'key',             // Stores settings & cached server history
    outbox: '++id, status'     // Offline queue
  });

  // --- Core Configuration Functions ---
  async function loadConfig() {
    const server = await db.config.get('server');
    const token = await db.config.get('token');
    const child = await db.config.get('child');

    if (server) document.getElementById('server-url').value = server.value;
    if (token) document.getElementById('api-token').value = token.value;

    if (server && token) {
      await fetchChildren(server.value, token.value, child ? child.value : null);
    }
  }

  async function saveConfig() {
    const serverUrl = document.getElementById('server-url').value.replace(/\/+$/, '');
    const apiToken = document.getElementById('api-token').value.trim();
    const childSelect = document.getElementById('child-select');
    const selectedChild = childSelect ? childSelect.value : null;

    if (!serverUrl || !apiToken) {
      return showToast('Please provide both Server URL and API Token');
    }

    await db.config.put({ key: 'server', value: serverUrl });
    await db.config.put({ key: 'token', value: apiToken });
    if (selectedChild) {
      await db.config.put({ key: 'child', value: selectedChild });
    }

    showToast('Settings saved!');
    await fetchChildren(serverUrl, apiToken, selectedChild);
    await fetchRecentHistory();
  }

  async function fetchChildren(serverUrl, apiToken, selectedChildId = null) {
    try {
      const res = await fetch(`${serverUrl}/api/children/`, {
        headers: { 'Authorization': `Token ${apiToken}` }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const children = data.results || data;

      const select = document.getElementById('child-select');
      if (select) {
        select.innerHTML = children.map(c => 
          `<option value="${c.id}" ${c.id == selectedChildId ? 'selected' : ''}>${c.first_name} ${c.last_name}</option>`
        ).join('');

        if (!selectedChildId && children.length > 0) {
          await db.config.put({ key: 'child', value: children[0].id });
        }
      }
    } catch (err) {
      console.error('Failed to fetch children:', err);
    }
  }

  // --- Diaper Logging (Fixed for DRF empty color field) ---
  async function logDiaper() {
    const childObj = await db.config.get('child');
    if (!childObj) return showToast('Configure Server & Child ID first!');

    const wet = document.getElementById('diaper-wet').checked;
    const solid = document.getElementById('diaper-solid').checked;
    const color = document.getElementById('diaper-color').value || ""; // Uses "" instead of null
    const notes = document.getElementById('diaper-notes').value.trim();

    if (!wet && !solid) {
      return showToast('Select Wet, Solid, or both.');
    }

    const payload = {
      child: childObj.value,
      time: new Date().toISOString(),
      wet: wet,
      solid: solid,
      color: color,
      notes: notes
    };

    await db.outbox.add({
      endpoint: 'changes',
      payload: payload,
      created_at: new Date().toISOString(),
      status: 'pending'
    });

    // Reset Form
    document.getElementById('diaper-wet').checked = false;
    document.getElementById('diaper-solid').checked = false;
    document.getElementById('diaper-color').value = '';
    document.getElementById('diaper-notes').value = '';

    showToast('Diaper entry queued locally!');
    await updateOutboxUI();
    triggerSync();
  }

  // --- Outbox & Background Sync Logic ---
  async function triggerSync() {
    // If browser supports Service Worker Background Sync, register the task
  if ('serviceWorker' in navigator && 'SyncManager' in window) {
    const reg = await navigator.serviceWorker.ready;
    try {
      await reg.sync.register('sync-babybuddy-outbox');
    } catch (err) {
      console.warn('Background sync registration failed, falling back to foreground sync:', err);
    }
  }

  // Regular foreground sync logic when app is open
  if (!navigator.onLine) return;

    const serverObj = await db.config.get('server');
    const tokenObj = await db.config.get('token');
    if (!serverObj || !tokenObj) return;

    const pendingItems = await db.outbox.where('status').equals('pending').toArray();
    if (pendingItems.length === 0) return;

    let syncedCount = 0;

    for (const item of pendingItems) {
      try {
        const res = await fetch(`${serverObj.value}/api/${item.endpoint}/`, {
          method: 'POST',
          headers: {
            'Authorization': `Token ${tokenObj.value}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(item.payload)
        });

        if (res.ok) {
          await db.outbox.delete(item.id);
          syncedCount++;
        } else {
          const errData = await res.json();
          console.error('API Error during sync:', errData);
        }
      } catch (err) {
        console.error('Sync network error:', err);
        break; // Stop loop if network cuts out
      }
    }

    if (syncedCount > 0) {
      showToast(`Synced ${syncedCount} queued item(s)!`);
      await updateOutboxUI();
      await fetchRecentHistory(); // Refresh recent history with newly posted logs
    }
  }

  async function updateOutboxUI() {
    const countEl = document.getElementById('outbox-count');
    const listEl = document.getElementById('outbox-list');
    const pending = await db.outbox.where('status').equals('pending').toArray();

    if (countEl) countEl.innerText = pending.length;
    if (listEl) {
      listEl.innerHTML = pending.length === 0 
        ? '<div class="text-xs text-gray-400 py-1">No pending items in queue.</div>'
        : pending.map(i => `
          <div class="text-xs bg-amber-50 border border-amber-200 p-2 rounded flex justify-between items-center">
            <span><strong>${i.endpoint.toUpperCase()}:</strong> ${new Date(i.created_at).toLocaleTimeString()}</span>
            <span class="text-amber-600 font-medium">Pending</span>
          </div>
        `).join('');
    }
  }

  // --- Recent Server History Logic ---
  function normalizeServerItem(item, endpoint) {
    if (endpoint === 'changes') {
      const types = [];
      if (item.wet) types.push('Wet');
      if (item.solid) types.push('Solid');
      const details = types.join(' + ') + (item.color ? ` (${item.color})` : '');
      return {
        time: new Date(item.time),
        icon: '🧷',
        title: 'Diaper Change',
        desc: details || 'Logged'
      };
    }

    if (endpoint === 'feedings') {
      const amt = item.amount ? `${item.amount} ml/oz` : '';
      const descParts = [item.type, item.method, amt].filter(Boolean).join(' • ');
      return {
        time: new Date(item.end || item.start),
        icon: '🍼',
        title: 'Feeding',
        desc: descParts || 'Feeding logged'
      };
    }

    if (endpoint === 'sleep') {
      const start = new Date(item.start);
      const end = new Date(item.end);
      const durationMin = Math.max(1, Math.round((end - start) / 60000));
      return {
        time: end,
        icon: '🌙',
        title: 'Sleep Session',
        desc: `${durationMin} min duration`
      };
    }
  }

  async function fetchRecentHistory() {
    if (!navigator.onLine) {
      renderServerHistory();
      return;
    }

    const serverObj = await db.config.get('server');
    const tokenObj = await db.config.get('token');
    const childObj = await db.config.get('child');

    if (!serverObj || !tokenObj || !childObj) return;

    const headers = {
      'Authorization': `Token ${tokenObj.value}`,
      'Content-Type': 'application/json'
    };

    try {
      const [changesRes, feedingsRes, sleepRes] = await Promise.all([
        fetch(`${serverObj.value}/api/changes/?child=${childObj.value}&limit=5`, { headers }),
        fetch(`${serverObj.value}/api/feedings/?child=${childObj.value}&limit=5`, { headers }),
        fetch(`${serverObj.value}/api/sleep/?child=${childObj.value}&limit=5`, { headers })
      ]);

      const changesData = changesRes.ok ? await changesRes.json() : { results: [] };
      const feedingsData = feedingsRes.ok ? await feedingsRes.json() : { results: [] };
      const sleepData = sleepRes.ok ? await sleepRes.json() : { results: [] };

      const rawChanges = changesData.results || changesData;
      const rawFeedings = feedingsData.results || feedingsData;
      const rawSleep = sleepData.results || sleepData;

      const merged = [
        ...rawChanges.map(i => normalizeServerItem(i, 'changes')),
        ...rawFeedings.map(i => normalizeServerItem(i, 'feedings')),
        ...rawSleep.map(i => normalizeServerItem(i, 'sleep'))
      ];

      merged.sort((a, b) => new Date(b.time) - new Date(a.time));
      const recentTen = merged.slice(0, 10);

      await db.config.put({ key: 'cached_server_history', value: recentTen });
      renderServerHistory();
    } catch (err) {
      console.error('Failed to fetch recent history:', err);
      renderServerHistory();
    }
  }

  async function renderServerHistory() {
    const card = document.getElementById('server-history-card');
    const list = document.getElementById('server-history-list');

    if (!card || !list) return;

    const cached = await db.config.get('cached_server_history');
    if (!cached || !cached.value || cached.value.length === 0) {
      card.classList.add('hidden');
      return;
    }

    card.classList.remove('hidden');

    list.innerHTML = cached.value.map(item => {
      const itemDate = new Date(item.time);
      const timeStr = itemDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = itemDate.toLocaleDateString([], { month: 'short', day: 'numeric' });

      return `
        <div class="pt-2 first:pt-0 flex justify-between items-center text-sm">
          <div class="flex items-center gap-3 overflow-hidden pr-2">
            <span class="text-xl leading-none">${item.icon}</span>
            <div class="truncate">
              <div class="font-semibold text-gray-800 leading-tight">${item.title}</div>
              <div class="text-xs text-gray-500 truncate">${item.desc}</div>
            </div>
          </div>
          <div class="text-right text-xs text-gray-400 whitespace-nowrap">
            <div>${timeStr}</div>
            <div class="text-[10px]">${dateStr}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // --- UI Helpers & Connectivity ---
  function showToast(msg) {
    const toast = document.getElementById('toast');
    if (!toast) return alert(msg);
    toast.innerText = msg;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3000);
  }

  function updateNetworkStatus() {
    const statusEl = document.getElementById('online-status');
    if (statusEl) {
      if (navigator.onLine) {
        statusEl.innerText = 'Online';
        statusEl.className = 'px-2 py-0.5 text-xs font-semibold rounded bg-green-100 text-green-800';
        triggerSync();
        fetchRecentHistory();
      } else {
        statusEl.innerText = 'Offline';
        statusEl.className = 'px-2 py-0.5 text-xs font-semibold rounded bg-gray-100 text-gray-800';
      }
    }
  }

  // --- Initial Load Listeners ---
  window.addEventListener('online', updateNetworkStatus);
  window.addEventListener('offline', updateNetworkStatus);

  document.addEventListener('DOMContentLoaded', async () => {
    await loadConfig();
    await updateOutboxUI();
    await renderServerHistory(); // Display cached items instantly
    updateNetworkStatus();       // Triggers online sync & fresh history fetch if online
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered successfully:', reg.scope))
        .catch(err => console.error('Service Worker registration failed:', err));
    });
  }
</script>
</body>
</html>
